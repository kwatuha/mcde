# System nginx: TLS termination + reverse proxy to MCmes stack (Docker nginx on host port 8084).
#
# Prerequisites:
#   1. DNS A record: cimes.machakos.go.ke -> 84.247.128.58
#   2. Machakos Docker stack running (compose nginx listens on 0.0.0.0:8084)
#   3. Ports 80/443 reachable from the internet (firewall)
#
# Install (on the MCmes server):
#   sudo bash deploy/install-cimes-nginx-on-server.sh
#   sudo certbot --nginx -d cimes.machakos.go.ke
#
# Or non-interactive:
#   sudo certbot --nginx -d cimes.machakos.go.ke --non-interactive --agree-tos -m YOUR_EMAIL --redirect

server {
    listen 80;
    listen [::]:80;
    server_name cimes.machakos.go.ke;

    client_max_body_size 100M;

    # Admin JWTs (~9KB) — avoid 400 Request Header Or Cookie Too Large
    client_header_buffer_size 16k;
    large_client_header_buffers 8 32k;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/html;
        allow all;
    }

    location / {
        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}

